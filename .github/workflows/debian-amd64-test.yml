name: Debian amd64 Test Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/debian-amd64-test.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - ui/**
      - assets/meatshell.desktop
      - assets/icon@512.png

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - name: Build
        run: cargo install cargo-deb && cargo deb
 
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64-test
          path: target/debian/*.deb
          retention-days: 7
