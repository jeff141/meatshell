name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-app:
    name: Build and Upload macOS App
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
      APP_NAME: meatshell
      BUNDLE_PATH: target/release/bundle/osx/meatshell.app

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build macOS app bundle
        run: cargo bundle --release

      - name: Set asset name
        id: asset
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "name=${APP_NAME}-macos-main.zip" >> "${GITHUB_OUTPUT}"
          else
            echo "name=${APP_NAME}-macos-${GITHUB_REF_NAME}.zip" >> "${GITHUB_OUTPUT}"
          fi

      - name: Zip macOS app
        shell: bash
        run: |
          test -d "${BUNDLE_PATH}"
          ditto -c -k --sequesterRsrc --keepParent \
            "${BUNDLE_PATH}" \
            "${{ steps.asset.outputs.name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.asset.outputs.name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
